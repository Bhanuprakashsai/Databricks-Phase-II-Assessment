# A sample job for Capsotone_Project_Phase_II.

resources:
  jobs:
    Assessment_job:
      name: Assessment_job

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      parameters:
        - name: catalog
          default: ${var.catalog}

      tasks:
        - task_key: Bronze
          notebook_task:
            notebook_path: ../src/Bronze.ipynb
        - task_key: silver
          depends_on:
            - task_key: Bronze
          notebook_task:
            notebook_path: ../src/Silver.ipynb
        - task_key: Gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../src/Gold.ipynb

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
