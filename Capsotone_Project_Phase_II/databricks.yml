# This is a Databricks asset bundle definition for Capsotone_Project_Phase_II.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: Capsotone_Project_Phase_II
  uuid: 5cee54c0-cec2-4144-ba32-75d23adcc914

include:
  - resources/*.yml
  - resources/*/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    presets: 
      name_prefix: dev_
    default: true
    workspace:
      host: https://dbc-3e8bcbae-5493.cloud.databricks.com
    variables:
      catalog: Dev_Assessment
  qa:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    presets : 
      name_prefix: qa_
    default: true
    workspace:
      host: https://dbc-3e8bcbae-5493.cloud.databricks.com
    variables:
      catalog: QA_Assessment
  prod:
    mode: production
    presets :
      name_prefix: prod_
    workspace:
      host: https://dbc-3e8bcbae-5493.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/bojjabhanuprakashsai@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/bojjabhanuprakashsai@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: Prod_Assesment
    permissions:
      - user_name: bojjabhanuprakashsai@gmail.com
        level: CAN_MANAGE
